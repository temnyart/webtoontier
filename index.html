let dragState={id:null,source:null,placeholder:null,targetZone:null};

function bindDnD(){
  $$("[draggable=true]").forEach(el=>{
    el.ondragstart=e=>{
      const id=el.dataset.id;
      dragState.id=id;
      dragState.source=el;
      e.dataTransfer.setData("text/plain",id);
      e.dataTransfer.effectAllowed="move";

      const ph=document.createElement("div");
      ph.className="sort-placeholder";
      ph.innerHTML="<span>여기에 놓기</span>";
      dragState.placeholder=ph;

      el.classList.add("dragging-card");
      const isTierCard=el.classList.contains("tcard");
      if(isTierCard){
        requestAnimationFrame(()=>el.style.display="none");
      }else{
        // Library cards keep their exact layout while dragging.
        el.classList.add("library-drag-source");
      }
    };

    el.ondragend=()=>{
      cleanupDragUI();
      dragState={id:null,source:null,placeholder:null,targetZone:null};
    };
  });

  $$(".drop").forEach(zone=>{
    zone.ondragenter=e=>{
      e.preventDefault();
      zone.classList.add("drag-active");
    };

    zone.ondragover=e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      zone.classList.add("drag-active");

      const ph=dragState.placeholder;
      if(!ph) return;

      const insertBefore=findInsertionPoint(zone,e.clientX,e.clientY);
      if(insertBefore){
        if(ph.parentElement!==zone || ph.nextElementSibling!==insertBefore){
          zone.insertBefore(ph,insertBefore);
        }
      }else{
        if(ph.parentElement!==zone || ph!==zone.lastElementChild){
          zone.appendChild(ph);
        }
      }
      dragState.targetZone=zone;
    };

    zone.ondragleave=e=>{
      if(!zone.contains(e.relatedTarget)){
        zone.classList.remove("drag-active");
      }
    };

    zone.ondrop=e=>{
      e.preventDefault();
      const id=dragState.id || e.dataTransfer.getData("text/plain");
      const w=works.find(x=>x.id===id);
      const ph=dragState.placeholder;
      if(!w || !ph) return;

      const targetTier=zone.dataset.tier||null;
      w.seen=true;
      w.tier=targetTier;

      const visibleCards=[...zone.querySelectorAll(".tcard")];
      let insertIndex=0;
      for(const node of zone.children){
        if(node===ph) break;
        if(node.classList && node.classList.contains("tcard")) insertIndex++;
      }

      const peers=works
        .filter(x=>x.id!==w.id && x.seen && (x.tier||null)===(targetTier||null) && groupMatch(x))
        .sort((a,b)=>(a.tierOrder??9999)-(b.tierOrder??9999));

      peers.splice(insertIndex,0,w);
      peers.forEach((x,i)=>x.tierOrder=i);

      cleanupDragUI();
      dragState={id:null,source:null,placeholder:null,targetZone:null};
      render();
    };
  });
}

function findInsertionPoint(zone,x,y){
  const cards=[...zone.querySelectorAll(".tcard")];
  if(!cards.length) return null;

  // Group cards by visual rows.
  const rows=[];
  for(const card of cards){
    const r=card.getBoundingClientRect();
    let row=rows.find(row=>Math.abs(row.top-r.top)<r.height*0.35);
    if(!row){
      row={top:r.top,bottom:r.bottom,cards:[]};
      rows.push(row);
    }
    row.cards.push({el:card,rect:r});
    row.top=Math.min(row.top,r.top);
    row.bottom=Math.max(row.bottom,r.bottom);
  }
  rows.sort((a,b)=>a.top-b.top);

  // Find closest row by y.
  let targetRow=rows[0];
  let best=Infinity;
  for(const row of rows){
    const cy=(row.top+row.bottom)/2;
    const d=Math.abs(y-cy);
    if(d<best){best=d;targetRow=row}
  }

  targetRow.cards.sort((a,b)=>a.rect.left-b.rect.left);
  for(const item of targetRow.cards){
    if(x < item.rect.left + item.rect.width/2) return item.el;
  }

  // If pointer is below this row and another row exists, insert before next row's first card.
  const idx=rows.indexOf(targetRow);
  if(y > targetRow.bottom && idx < rows.length-1){
    const next=rows[idx+1].cards.sort((a,b)=>a.rect.left-b.rect.left);
    return next[0]?.el || null;
  }
  return null;
}

function cleanupDragUI(){
  if(dragState.source){

  }
  if(dragState.placeholder?.parentElement){
    dragState.placeholder.remove();
  }

}

window.downloadTierImage=async()=>{
  const btn=document.querySelector(".tier-export-btn");
  if(btn) {
    btn.disabled=true;
    btn.textContent="이미지 만드는 중…";
  }

  try{
    const tierNames=["S","A","B","C","D"];
    const tierColors={
      S:"#ff9a9a",
      A:"#ffc48d",
      B:"#ffe49c",
      C:"#c9e8a9",
      D:"#b2dceb"
    };

    const visible=works.filter(w=>w.seen&&groupMatch(w));
    const grouped={};
    tierNames.forEach(t=>{
      grouped[t]=visible
        .filter(w=>w.tier===t)
        .sort((a,b)=>(a.tierOrder??9999)-(b.tierOrder??9999));
    });

    const cardW=92, cardH=150, gap=12;
    const labelW=68, pad=18;
    const maxPerRow=8;
    const contentW=maxPerRow*(cardW+gap)-gap;
    const width=labelW+pad*3+contentW;

    const rowHeights=tierNames.map(t=>{
      const count=grouped[t].length;
      const rows=Math.max(1,Math.ceil(count/maxPerRow));
      return Math.max(170, rows*(cardH+gap)+pad*2-gap);
    });

    const headerH=82;
    const totalH=headerH+rowHeights.reduce((a,b)=>a+b,0)+pad*2;

    const scale=2;
    const canvas=document.createElement("canvas");
    canvas.width=width*scale;
    canvas.height=totalH*scale;
    const ctx=canvas.getContext("2d");
    ctx.scale(scale,scale);

    // Background
    ctx.fillStyle="#f5f5f7";
    ctx.fillRect(0,0,width,totalH);

    // Header
    ctx.fillStyle="#1d1d1f";
    ctx.font='700 28px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
    ctx.fillText("WebtoonTier",pad,38);
    ctx.fillStyle="#86868b";
    ctx.font='500 12px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
    const scopeText=scope==="전체"?"전체 통합 티어":scope+" 티어";
    ctx.fillText(scopeText+" · "+visible.filter(w=>w.tier).length+"작품",pad,60);

    let y=headerH;

    for(let ti=0;ti<tierNames.length;ti++){
      const tier=tierNames[ti];
      const items=grouped[tier];
      const rh=rowHeights[ti];

      // Row card
      roundRect(ctx,pad,y,width-pad*2,rh,18,"#ffffff");
      ctx.strokeStyle="rgba(0,0,0,.08)";
      ctx.lineWidth=1;
      strokeRoundRect(ctx,pad,y,width-pad*2,rh,18);

      // Tier label
      roundRect(ctx,pad,y,labelW,rh,18,tierColors[tier],true,false);
      ctx.fillStyle="#1d1d1f";
      ctx.font='800 26px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(tier,pad+labelW/2,y+rh/2);
      ctx.textAlign="left";
      ctx.textBaseline="alphabetic";

      if(items.length===0){
        ctx.fillStyle="#aeaeb2";
        ctx.font='500 12px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
        ctx.fillText("등록된 작품 없음",pad+labelW+24,y+rh/2+4);
      }

      for(let i=0;i<items.length;i++){
        const row=Math.floor(i/maxPerRow);
        const col=i%maxPerRow;
        const x=pad+labelW+pad+col*(cardW+gap);
        const cy=y+pad+row*(cardH+gap);
        await drawTierExportCard(ctx,items[i],x,cy,cardW,cardH);
      }

      y+=rh;
    }

    const a=document.createElement("a");
    const now=new Date();
    const pad2=n=>String(n).padStart(2,"0");
    const stamp=`${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}_${pad2(now.getHours())}${pad2(now.getMinutes())}`;
    a.download=`webtoontier_${scopeText}_${stamp}.png`;
    a.href=canvas.toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    console.error(e);
    alert("이미지 저장 중 오류가 발생했습니다.");
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent="티어리스트 이미지 저장";
    }
  }
};

function roundRect(ctx,x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill){
    ctx.fillStyle=fill;
    ctx.fill();
  }
}
function strokeRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.stroke();
}

async function drawTierExportCard(ctx,w,x,y,cw,ch){
  const coverH=118;

  // card background
  roundRect(ctx,x,y,cw,ch,12,"#ffffff");

  // cover background
  roundRect(ctx,x,y,cw,coverH,10,"#e8e8ed");

  const src=w.thumbnail||searchThumb(w);
  let drawn=false;

  if(src){
    try{
      const img=await loadExportImage(src);
      ctx.save();
      roundedClip(ctx,x,y,cw,coverH,10);
      const ratio=Math.max(cw/img.width,coverH/img.height);
      const dw=img.width*ratio, dh=img.height*ratio;
      ctx.drawImage(img,x+(cw-dw)/2,y+(coverH-dh)/2,dw,dh);
      ctx.restore();
      drawn=true;
    }catch(e){}
  }

  if(!drawn){
    const g=ctx.createLinearGradient(x,y,x+cw,y+coverH);
    g.addColorStop(0,"#2c2c2e");
    g.addColorStop(1,"#6e6e73");
    ctx.fillStyle=g;
    roundRect(ctx,x,y,cw,coverH,10,g);
    ctx.fillStyle="#fff";
    ctx.font='700 11px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    drawWrappedText(ctx,w.title,x+cw/2,y+coverH/2,cw-16,14,3);
    ctx.textAlign="left";
    ctx.textBaseline="alphabetic";
  }

  // title
  ctx.fillStyle="#1d1d1f";
  ctx.font='650 10.5px -apple-system,BlinkMacSystemFont,"Pretendard",sans-serif';
  ctx.textAlign="center";
  ctx.textBaseline="top";
  drawWrappedText(ctx,w.title,x+cw/2,y+coverH+7,cw-6,12,2);
  ctx.textAlign="left";
  ctx.textBaseline="alphabetic";
}

function roundedClip(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.clip();
}

function loadExportImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
    setTimeout(()=>reject(new Error("timeout")),3500);
  });
}

function drawWrappedText(ctx,text,cx,startY,maxWidth,lineHeight,maxLines){
  const chars=[...String(text||"")];
  const lines=[];
  let line="";
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){
      lines.push(line);
      line=ch;
      if(lines.length===maxLines-1) break;
    }else{
      line=test;
    }
  }
  if(lines.length<maxLines && line) lines.push(line);
  if(lines.length===maxLines){
    let last=lines[maxLines-1];
    while(ctx.measureText(last+"…").width>maxWidth && last.length>1) last=last.slice(0,-1);
    lines[maxLines-1]=last+(last!==text?"…":"");
  }
  lines.slice(0,maxLines).forEach((ln,i)=>ctx.fillText(ln,cx,startY+i*lineHeight));
}
